name: special-quizzes
on:
  workflow_dispatch:
  push:
    paths: ["special_topics.txt", ".github/workflows/special.yml"]
permissions:
  contents: write
concurrency: special-quizzes
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: { path: .kokoro, key: kokoro-v1 }
      - name: Make one video per topic (nothing is posted)
        run: |
          i=0
          while IFS= read -r T; do
            [ -z "$T" ] && continue
            i=$((i+1)); D="out/$i"
            if python generate_quiz.py --out "$D" --topic "$T" && python make_video.py "$D/quiz.json" "$D"; then
              python - "$D" <<'PY'
          import json, sys
          q = json.load(open(sys.argv[1] + "/quiz.json"))
          lines = [f"Category: {q['category']}", "", q["caption"], " ".join(q.get("hashtags") or []), ""]
          for n, x in enumerate(q["questions"], 1): lines.append(f"{n}. {x['text']}  ->  {x['options'][x['answer']]}")
          open(sys.argv[1] + "/notes.md", "w").write("\n".join(lines))
          PY
              gh release create "special-${{ github.run_number }}-$i" "$D/quiz.mp4" "$D/quiz.json" "$D/verification.json" --title "$T" --notes-file "$D/notes.md"
            else
              echo "FAILED topic: $T"
            fi
          done < special_topics.txt
