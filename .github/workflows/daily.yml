# trigger: special topic run
name: daily-quiz
on:
  schedule:
    - cron: "17 2 * * *"   # ~07:47 IST every day (off the busy :00/:30 slots)
  workflow_dispatch:
  push:
    paths: [".github/workflows/daily.yml"]
permissions:
  contents: write
concurrency: daily-quiz
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: { path: .kokoro, key: kokoro-v1 }
      - name: Generate and verify quiz
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then export QUIZ_RECORD=1; fi
          if [ -f special_topic.txt ]; then python generate_quiz.py --out out --topic "$(cat special_topic.txt)"; else python generate_quiz.py --out out; fi
      - name: Render video
        run: python make_video.py out/quiz.json out
      - name: Publish for review (GitHub release)
        run: |
          D=$(date -u +%F); [ "${{ github.event_name }}" = "push" ] && D="test-$D-${{ github.run_number }}"
          TAG="quiz-$D"
          python - <<'PY'
          import json
          q=json.load(open("out/quiz.json"))
          lines=[f"Category: {q['category']}","",q["caption"]," ".join(q.get("hashtags") or []),""]
          for i,x in enumerate(q["questions"],1): lines.append(f"{i}. {x['text']}  ->  {x['options'][x['answer']]}")
          open("out/notes.md","w").write("\n".join(lines))
          PY
          gh release create "$TAG" out/quiz.mp4 out/quiz.json out/verification.json --title "$TAG" --notes-file out/notes.md
          echo "Video: https://github.com/${{ github.repository }}/releases/download/$TAG/quiz.mp4"
      - name: Upload to YouTube (via Make)
        env:
          MAKE_YT_WEBHOOK: ${{ secrets.MAKE_YT_WEBHOOK }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -f special_topic.txt ]; then echo "special run - YouTube is uploaded manually"; exit 0; fi
          if [ -z "$MAKE_YT_WEBHOOK" ]; then echo "MAKE_YT_WEBHOOK not set - skipping YouTube"; exit 0; fi
          D=$(date -u +%F); [ "$EVENT" = "push" ] && D="test-$D-${{ github.run_number }}"
          export VIDEO_URL="https://github.com/${{ github.repository }}/releases/download/quiz-$D/quiz.mp4"
          if [ "$EVENT" = "push" ]; then export PRIVACY=private; else export PRIVACY=public; fi
          python - <<'PY' > payload.json
          import json, os
          q = json.load(open("out/quiz.json"))
          title = f"{q['category']} Quiz: Can You Score 5/5? #Shorts"[:100]
          desc = q["caption"] + "\n\n" + " ".join(q.get("hashtags") or []) + "\n\nNew quiz every day - subscribe to QuizNova!"
          print(json.dumps(dict(video_url=os.environ["VIDEO_URL"], title=title, description=desc, privacy=os.environ["PRIVACY"])))
          PY
          curl -sS -m 120 -X POST -H "Content-Type: application/json" --data @payload.json "$MAKE_YT_WEBHOOK"; echo
      - name: Save history
        if: github.event_name != 'push'
        run: |
          git config user.name quiz-reels-bot; git config user.email bot@users.noreply.github.com
          git add data/history.json; git commit -m "history $(date -u +%F)" || exit 0; git push
